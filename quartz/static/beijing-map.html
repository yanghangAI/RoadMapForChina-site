<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beijing Route Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f5f5f5;
      }
      #map {
        height: 100vh;
        width: 100%;
      }
      .legend {
        position: absolute;
        bottom: 24px;
        left: 12px;
        z-index: 1000;
        background: white;
        border-radius: 8px;
        padding: 10px 14px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        font-size: 12px;
        line-height: 1.8;
      }
      .legend-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="legend">
      <div><span class="legend-dot" style="background: #2b6cb0"></span>Home Base · Jiangtai Lu</div>
      <div><span class="legend-dot" style="background: #2f855a"></span>Day 1 · Arrival</div>
      <div><span class="legend-dot" style="background: #c05621"></span>Day 2 · Great Wall</div>
      <div>
        <span class="legend-dot" style="background: #6b46c1"></span>Day 3 · Imperial Beijing
      </div>
      <div style="margin-top: 4px; padding-top: 4px; border-top: 1px solid #eee">
        <span
          style="
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #718096;
            transform: rotate(45deg);
            margin-right: 8px;
          "
        ></span
        >Optional stops
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const map = L.map("map", { zoomControl: true }).setView([40.05, 116.43], 10)

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap contributors",
          maxZoom: 18,
        }).addTo(map)

        const stops = [
          {
            name: "Home Base · 丽都饭店附近",
            day: "Base · All Days",
            coords: [39.972, 116.476],
            slug: null,
            color: "#2b6cb0",
            num: "H",
          },
          {
            name: "798 Art District · 798艺术区",
            day: "Day 1 · Afternoon",
            coords: [39.984, 116.497],
            slug: "beijing/798-art-district",
            color: "#2f855a",
            num: 1,
          },
          {
            name: "Da Dong · 大董烤鸭",
            day: "Day 1 · Dinner",
            coords: [39.935, 116.442],
            slug: null,
            color: "#2f855a",
            num: 2,
          },
          {
            name: "Mutianyu Great Wall · 慕田峪长城",
            day: "Day 2 · Morning",
            coords: [40.433, 116.567],
            slug: "beijing/mutianyu",
            color: "#c05621",
            num: 3,
          },
          {
            name: "Brickyard Restaurant · 砖窑餐厅",
            day: "Day 2 · Lunch",
            coords: [40.418, 116.561],
            slug: null,
            color: "#c05621",
            num: 4,
          },
          {
            name: "Olympic Park · 奥林匹克公园",
            day: "Day 2 · Afternoon",
            coords: [40.002, 116.392],
            slug: null,
            color: "#c05621",
            num: 5,
          },
          {
            name: "Haidilao · 海底捞三里屯",
            day: "Day 2 · Dinner",
            coords: [39.933, 116.453],
            slug: null,
            color: "#c05621",
            num: 6,
          },
          {
            name: "Tiananmen Square · 天安门广场",
            day: "Day 3 · Morning",
            coords: [39.905, 116.391],
            slug: "beijing/tiananmen",
            color: "#6b46c1",
            num: 7,
          },
          {
            name: "Forbidden City · 故宫博物院",
            day: "Day 3 · Morning",
            coords: [39.916, 116.39],
            slug: "beijing/forbidden-city",
            color: "#6b46c1",
            num: 8,
          },
          {
            name: "Wangfujing · 王府井",
            day: "Day 3 · Lunch",
            coords: [39.915, 116.409],
            slug: null,
            color: "#6b46c1",
            num: 9,
          },
          {
            name: "Nanluoguxiang · 南锣鼓巷",
            day: "Day 3 · Afternoon",
            coords: [39.937, 116.399],
            slug: "beijing/nanluoguxiang",
            color: "#6b46c1",
            num: 10,
          },
          {
            name: "Beijing West Station · 北京西站",
            day: "Day 3 · Evening",
            coords: [39.895, 116.322],
            slug: null,
            color: "#6b46c1",
            num: 11,
          },
        ]

        const optional = [
          {
            name: "Summer Palace · 颐和园",
            day: "Optional · swap Olympic Park",
            coords: [39.999, 116.275],
            slug: null,
            color: "#718096",
          },
          {
            name: "Temple of Heaven · 天坛",
            day: "Optional · Day 3 add-on",
            coords: [39.882, 116.407],
            slug: null,
            color: "#718096",
          },
          {
            name: "Lama Temple · 雍和宫",
            day: "Optional · near Nanluoguxiang",
            coords: [39.947, 116.416],
            slug: null,
            color: "#718096",
          },
        ]

        // Route polyline
        L.polyline(
          stops.map((s) => s.coords),
          {
            color: "#e53e3e",
            weight: 3,
            opacity: 0.65,
            dashArray: "8, 6",
          },
        ).addTo(map)

        // Markers
        stops.forEach((stop) => {
          const icon = L.divIcon({
            html: `<div style="
        background:${stop.color}; color:white; width:28px; height:28px;
        border-radius:50%; display:flex; align-items:center; justify-content:center;
        font-size:11px; font-weight:bold; border:2px solid white;
        box-shadow:0 2px 6px rgba(0,0,0,0.35); cursor:pointer;
      ">${stop.num}</div>`,
            className: "",
            iconSize: [28, 28],
            iconAnchor: [14, 14],
            popupAnchor: [0, -18],
          })

          const lat = stop.coords[0],
            lng = stop.coords[1]
          const name = encodeURIComponent(stop.name)
          const mapLinks = `
      <div style="margin-top:8px; display:flex; flex-direction:column; gap:4px;">
        <a href="https://maps.apple.com/?ll=${lat},${lng}&q=${name}" target="_blank"
           style="font-size:12px; padding:3px 8px; background:#f0f0f0; border-radius:4px; text-decoration:none; color:#333;">🍎 Apple Maps</a>
        <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank"
           style="font-size:12px; padding:3px 8px; background:#f0f0f0; border-radius:4px; text-decoration:none; color:#333;">🌐 Google Maps</a>
        <a href="https://uri.amap.com/marker?position=${lng},${lat}&name=${name}" target="_blank"
           style="font-size:12px; padding:3px 8px; background:#f0f0f0; border-radius:4px; text-decoration:none; color:#333;">🗺 高德地图</a>
        <a href="https://api.map.baidu.com/marker?location=${lat},${lng}&title=${name}&output=html" target="_blank"
           style="font-size:12px; padding:3px 8px; background:#f0f0f0; border-radius:4px; text-decoration:none; color:#333;">🔵 百度地图</a>
      </div>`

          const detailLink = stop.slug
            ? `<a href="../${stop.slug}" target="_top" style="font-size:12px; color:#2b6cb0; text-decoration:none;">View Details →</a>`
            : ""

          const popup = `
      <div style="font-family:-apple-system,sans-serif; min-width:170px;">
        <div style="font-weight:bold; font-size:14px; margin-bottom:2px;">${stop.name}</div>
        <div style="color:#777; font-size:12px; margin-bottom:4px;">${stop.day}</div>
        ${detailLink}
        ${mapLinks}
      </div>`

          L.marker(stop.coords, { icon }).addTo(map).bindPopup(popup, { maxWidth: 240 })
        })

        // Optional destination markers (diamond shape)
        optional.forEach((stop) => {
          const icon = L.divIcon({
            html: `<div style="
        background:${stop.color}; color:white; width:24px; height:24px;
        transform:rotate(45deg); display:flex; align-items:center; justify-content:center;
        border:2px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.3); cursor:pointer;
      "></div>`,
            className: "",
            iconSize: [24, 24],
            iconAnchor: [12, 12],
            popupAnchor: [0, -16],
          })

          const lat = stop.coords[0],
            lng = stop.coords[1]
          const name = encodeURIComponent(stop.name)
          const mapLinks = `
      <div style="margin-top:8px; display:flex; flex-direction:column; gap:4px;">
        <a href="https://maps.apple.com/?ll=${lat},${lng}&q=${name}" target="_blank"
           style="font-size:12px; padding:3px 8px; background:#f0f0f0; border-radius:4px; text-decoration:none; color:#333;">🍎 Apple Maps</a>
        <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank"
           style="font-size:12px; padding:3px 8px; background:#f0f0f0; border-radius:4px; text-decoration:none; color:#333;">🌐 Google Maps</a>
        <a href="https://uri.amap.com/marker?position=${lng},${lat}&name=${name}" target="_blank"
           style="font-size:12px; padding:3px 8px; background:#f0f0f0; border-radius:4px; text-decoration:none; color:#333;">🗺 高德地图</a>
        <a href="https://api.map.baidu.com/marker?location=${lat},${lng}&title=${name}&output=html" target="_blank"
           style="font-size:12px; padding:3px 8px; background:#f0f0f0; border-radius:4px; text-decoration:none; color:#333;">🔵 百度地图</a>
      </div>`

          const popup = `
      <div style="font-family:-apple-system,sans-serif; min-width:170px;">
        <div style="font-weight:bold; font-size:14px; margin-bottom:2px;">${stop.name}</div>
        <div style="color:#777; font-size:12px; margin-bottom:4px;">${stop.day}</div>
        ${mapLinks}
      </div>`

          L.marker(stop.coords, { icon }).addTo(map).bindPopup(popup, { maxWidth: 240 })
        })

        setTimeout(() => map.invalidateSize(), 100)
      })
    </script>
  </body>
</html>
